<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限不足 - 客户照片管理</title>
    <style>
        :root {
            --primary: #e8567e;
            --text: #2d3436;
            --text2: #636e72;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,#ffeaa7,#fdcb6e);
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background:white; border-radius:18px; padding:40px;
            box-shadow:0 8px 40px rgba(0,0,0,0.1); text-align:center; max-width:360px;
        }
        .icon { font-size:56px; margin-bottom:16px; }
        h1 { font-size:22px; color:var(--text); margin-bottom:8px; }
        p { font-size:14px; color:var(--text2); margin-bottom:24px; line-height:1.6; }
        .btn {
            display:inline-block; padding:10px 24px; border-radius:8px;
            font-size:14px; font-weight:500; text-decoration:none; transition:.2s;
        }
        .btn-primary { background:var(--primary); color:white; }
        .btn-primary:hover { opacity:0.9; }
        .btn-outline { background:white; color:var(--text2); border:1px solid #ddd; margin-left:8px; }
        .btn-outline:hover { border-color:var(--primary); color:var(--primary); }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔒</div>
    <h1>权限不足</h1>
    <p>当前账户为只读权限，无法执行此操作。<br>如需管理权限，请联系管理员登录。</p>
    <a href="javascript:history.back()" class="btn btn-primary">返回上一页</a>
    <a href="/" class="btn btn-outline">回到首页</a>
</div>
</body>
</html>
