{% extends "base.html" %}

{% block title %}修改密码{% endblock %}

{% block content %}
<div class="pwd-card">
    <h2>🔑 修改密码</h2>
    <p style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:16px;">
        当前账户：<strong style="color:var(--primary);">
            {% if role == 'admin' %}👑 管理员{% else %}👁 只读查看{% endif %}
        </strong>
    </p>

    {% if error %}
    <div style="color:var(--red);font-size:13px;margin-bottom:12px;text-align:center;">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>原密码</label>
            <input type="password" name="old_password" placeholder="请输入原密码" required autofocus>
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" name="new_password" placeholder="请输入新密码（至少4位）" required>
        </div>
        <div class="form-group">
            <label>确认新密码</label>
            <input type="password" name="confirm_password" placeholder="再次输入新密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">确认修改</button>
    </form>

    <div style="text-align:center;margin-top:14px;">
        <a href="/" class="btn btn-outline btn-sm">返回首页</a>
    </div>
</div>
{% endblock %}
